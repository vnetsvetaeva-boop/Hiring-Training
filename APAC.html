<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Bai Jamjuree',sans-serif;background:#fff;color:#000;padding:20px 28px;line-height:1.5;max-width:100%;margin:0 auto}

.header{background:linear-gradient(135deg,#80EAFF,#50D0ED);border-radius:12px;padding:24px 28px;margin-bottom:22px}
.header h1{font-size:32px;font-weight:700;color:#0A3D4F;line-height:1.2}

.table-wrap{border:1px solid #ecedea;border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:16px 6px;text-align:center;font-size:20px;font-weight:500;border-bottom:1px solid #ecedea}
thead th{background:#f7f7f5;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:#555;line-height:1.25;padding:12px 4px}
col.c-type{width:34%}
col.c-country{width:11%}
th.type,td.type{text-align:left;font-weight:600;padding-left:16px}
tbody tr:last-child td{border-bottom:none}

.row-main{cursor:pointer;transition:background .15s}
.row-main:hover{background:#fbfbfa}
.row-main.open{background:#f2fbff}
.type-cell{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;line-height:1.25}
.dot{width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:#e9eae7;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .15s}
.row-main.open .dot{background:linear-gradient(135deg,#80EAFF,#50D0ED);color:#0A3D4F}
.yes{color:#059669;font-weight:700}
.no{color:#d1d5db;font-weight:700}
.note{display:block;font-size:10px;color:#888;font-weight:600;line-height:1.2;margin-top:2px}

.panel{background:#f7f7f5;border-left:4px solid #80EAFF;border-radius:0 10px 10px 0;padding:16px 20px;margin-top:16px;min-height:112px}
.panel .p-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#0A3D4F;font-weight:700;margin-bottom:6px}
.panel .p-text{font-size:18px;font-weight:500;line-height:1.45}

.legend{display:flex;gap:20px;margin-top:16px;font-size:14px;color:#999;font-weight:500}
.legend div{display:flex;align-items:center;gap:6px}
</style>
</head>
<body>

<div class="header">
  <h1>Check the available engagement route</h1>
</div>

<div class="table-wrap">
<table>
  <colgroup>
    <col class="c-type"><col class="c-country"><col class="c-country"><col class="c-country"><col class="c-country"><col class="c-country"><col class="c-country">
  </colgroup>
  <thead>
    <tr>
      <th class="type">Engagement type</th>
      <th>Malay&shy;sia</th><th>China</th><th>Hong Kong</th><th>Japan</th><th>Korea</th><th>Other APAC</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<div class="panel">
  <div class="p-title" id="pTitle"></div>
  <div class="p-text" id="pText"></div>
</div>

<div class="legend">
  <div><span class="yes">✅</span> Available</div>
  <div><span class="no">❌</span> Not available</div>
</div>

<script>
const DATA=[
 {name:"Full-time employment",cells:["y","y","y","y","y","n"],
  what:"Permanent contract with an Xsolla local entity — no end date, full employee benefits."},
 {name:"Fixed-term employment",cells:["y","n","n","y","y","n"],
  what:"Employment contract with a set end date — a real employee, just for a limited period."},
 {name:"Contractor",cells:["y","n","n","n","y","y"],
  what:"B2B services agreement with an independent professional who invoices us — no salary or benefits."},
 {name:"EOR employment",cells:["n","n","n","n","n","y"],
  what:"A third-party Employer of Record legally employs the person for us where Xsolla has no entity."},
 {name:"Student or intern",cells:["y","y-beijing","n","n","n","n"],
  what:"Temporary learning placement with a mentor and a fixed duration, usually tied to a university programme."}
];

const tbody=document.getElementById('tbody'),
      pTitle=document.getElementById('pTitle'),
      pText=document.getElementById('pText'),
      rows=[];

function select(i){
  rows.forEach((r,j)=>r.classList.toggle('open',j===i));
  pTitle.textContent=DATA[i].name;
  pText.textContent=DATA[i].what;
}

DATA.forEach((r,i)=>{
  const tr=document.createElement('tr');
  tr.className='row-main';
  tr.innerHTML='<td class="type"><span class="type-cell"><span class="dot">●</span>'+r.name+'</span></td>'+
    r.cells.map(c=>{
      if(c==='y')return '<td><span class="yes">✅</span></td>';
      if(c==='n')return '<td><span class="no">❌</span></td>';
      return '<td><span class="yes">✅</span><span class="note">Beijing only</span></td>';
    }).join('');
  tr.onclick=()=>select(i);
  rows.push(tr);
  tbody.appendChild(tr);
});

select(0);
</script>

</body>
</html>
