<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Bai Jamjuree',sans-serif;background:#fff;color:#000;padding:20px 28px;line-height:1.5;max-width:100%;margin:0 auto}

.header{background:linear-gradient(135deg,#80EAFF 0%,#50D0ED 100%);border-radius:12px;padding:22px 26px 18px;margin-bottom:24px}
.header-eyebrow{font-size:.75rem;font-weight:600;color:rgba(0,60,80,.5);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.header-title{font-size:28px;font-weight:700;color:#0A3D4F;line-height:1.2}
.header-sub{font-size:16px;color:rgba(0,60,80,.55);margin-top:6px}

.steps{display:flex;gap:0;margin-bottom:24px;padding:0 4px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;padding:10px 2px 12px;border-radius:10px;transition:background .15s}
.step:hover{background:rgba(0,0,0,.03)}
.step.active:hover{background:rgba(128,234,255,.08)}

.step:not(:last-child)::after{content:'';position:absolute;top:28px;left:calc(50% + 22px);width:calc(100% - 44px);height:2.5px;background:#ecedea;z-index:0}
.step.done:not(:last-child)::after{background:#80EAFF}

.step-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;position:relative;z-index:1;transition:all .2s}
.step-circle.off{background:#f4f4f3;color:#aaa;border:2px solid #ecedea}
.step-circle.on{background:#80EAFF;color:#0A3D4F;border:2.5px solid #50D0ED}
.step-circle.sel{box-shadow:0 0 0 5px rgba(128,234,255,.35);transform:scale(1.12)}

.step-label{font-size:13px;font-weight:600;color:#999;text-align:center;margin-top:8px;line-height:1.25}
.step.active .step-label{color:#000;font-weight:700}

.step-role{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:4px;padding:3px 8px;border-radius:4px}
.role-you{background:#E0F7FF;color:#0E7490}
.role-hr{background:#f4f4f3;color:#999}
.role-both{background:#ECFDF5;color:#065F46}
.role-it{background:#F3E8FF;color:#7C3AED}

.detail{background:#f7f7f5;border-left:4px solid #80EAFF;padding:22px 26px;border-radius:0 10px 10px 0;margin-bottom:16px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.detail-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.detail-num{width:32px;height:32px;border-radius:50%;background:#80EAFF;color:#0A3D4F;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.detail-title{font-size:22px;font-weight:700;color:#000}
.detail-badge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;padding:4px 10px;border-radius:5px;margin-left:auto}
.detail-text{font-size:18px;font-weight:500;color:#333;line-height:1.6}

.coverage{background:#f7f7f5;border:1px solid #ecedea;border-radius:10px;padding:14px 20px;font-size:16px;color:#555;line-height:1.5;text-align:center}
.coverage strong{color:#000}
</style>
</head>
<body>

<div class="header">
  <div class="header-eyebrow">Your journey</div>
  <div class="header-title">From Finalist to First Day</div>
  <div class="header-sub">Click any step to see what happens and who's responsible</div>
</div>

<div class="steps" id="steps"></div>
<div id="detail"></div>

<script>
var STEPS=[
  {num:1,short:"Select Finalist",role:"you",roleLabel:"You",covered:false,
   title:"Select Your Final Candidate",
   text:"Interviews are complete and the decision is made — you know who you want to hire. This step is already done by the time you reach this course."},
  {num:2,short:"Submit ZIP Offer Request",role:"you",roleLabel:"You",covered:true,
   title:"Submit ZIP Offer Request",
   text:"You initiate the offer by submitting a ZIP request with all required details for budget approval. This is your primary action step — accuracy here prevents delays downstream."},
  {num:3,short:"Submit HR Service Desk",role:"you",roleLabel:"You",covered:true,
   title:"Submit HR Service Desk Request",
   text:"You submit an HR Service Desk request with all required details — candidate\u2019s legal name, salary, job title, start date, employment type, and supporting documents. Accuracy here prevents delays downstream."},
  {num:4,short:"Legal Review (If Required)",role:"both",roleLabel:"HR + Legal",covered:true,
   title:"Legal Review (If Required)",
   text:"Triggered by special circumstances — non-standard contract terms, unusual employment arrangements, or regional legal requirements. If needed, Legal reviews and approves the draft. You stay available for questions but don\u2019t need to take action."},
  {num:5,short:"Close Role",role:"you",roleLabel:"You",covered:true,
   title:"Close the Role",
   text:"Once the candidate has signed the agreement and no other candidates are needed for this role, you close the position in Lever. Archive all remaining candidates with accurate reasons and send disposition communications. SLA: 5 days to archive, 10 days to close."},
  {num:6,short:"Onboarding Begins",role:"it",roleLabel:"IT + You",covered:false,
   title:"Onboarding Begins",
   text:"IT sets up equipment and access — this process starts 14 business days prior to the employee\u2019s first day. You coordinate first-day logistics with the onboarding team. Your new hire is on the way!"}
];

var sel=0;

function render(){
  var stepsEl=document.getElementById('steps');
  var detailEl=document.getElementById('detail');

  stepsEl.innerHTML=STEPS.map(function(s,i){
    var circCls=s.covered?'step-circle on':'step-circle off';
    if(i===sel)circCls+=' sel';
    var stepCls='step'+(s.covered?' active':'');
    if(i<=sel&&STEPS[i].covered)stepCls+=' done';
    if(i>0&&i<=sel){
      var prev=STEPS[i-1];
      if(prev.covered)stepCls+=' done';
    }
    var roleCls=s.role==='you'?'role-you':s.role==='hr'?'role-hr':s.role==='it'?'role-it':'role-both';
    return '<div class="'+stepCls+'" data-idx="'+i+'">'+
      '<div class="'+circCls+'">'+s.num+'</div>'+
      '<div class="step-label">'+s.short+'</div>'+
      '<div class="step-role '+roleCls+'">'+s.roleLabel+'</div>'+
    '</div>';
  }).join('');

  var s=STEPS[sel];
  var badgeCls=s.role==='you'?'role-you':s.role==='hr'?'role-hr':s.role==='it'?'role-it':'role-both';
  detailEl.innerHTML=
    '<div class="detail">'+
      '<div class="detail-header">'+
        '<div class="detail-num">'+s.num+'</div>'+
        '<div class="detail-title">'+s.title+'</div>'+
        '<div class="detail-badge '+badgeCls+'">'+s.roleLabel+'</div>'+
      '</div>'+
      '<div class="detail-text">'+s.text+'</div>'+
    '</div>';

  stepsEl.querySelectorAll('.step').forEach(function(el){
    el.addEventListener('click',function(){
      sel=parseInt(el.dataset.idx);
      render();
    });
  });
}

render();
</script>
</body>
</html>
