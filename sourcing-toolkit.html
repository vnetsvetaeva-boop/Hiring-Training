<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Bai Jamjuree',sans-serif;background:#fff;color:#000;padding:20px 28px;line-height:1.5;max-width:100%;margin:0 auto}
.wrap{max-width:760px;margin:0 auto}

.header{background:linear-gradient(135deg,#80EAFF 0%,#50D0ED 100%);border-radius:12px;padding:18px 24px;margin-bottom:16px}
.header-eyebrow{font-size:11px;font-weight:600;color:rgba(0,60,80,.5);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:2px}
.header-title{font-size:28px;font-weight:700;color:#0A3D4F;line-height:1.15}
.header-sub{font-size:14px;color:rgba(0,60,80,.55);font-weight:500;margin-top:4px}

.rows{display:flex;flex-direction:column;gap:10px}
.row{border:2px solid #ecedea;border-radius:10px;background:#fff;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.row:hover{border-color:#b0e8f7}
.row.active{border-color:#50D0ED;box-shadow:0 4px 18px rgba(128,234,255,.22)}

.row-head{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;transition:background .2s}
.row.active .row-head{background:linear-gradient(135deg,#80EAFF 0%,#50D0ED 100%)}
.row-num{flex:none;width:32px;height:32px;border-radius:50%;background:#0A3D4F;color:#80EAFF;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.row.active .row-num{background:#0A3D4F;color:#80EAFF}
.row-icon{flex:none;font-size:26px;line-height:1}
.row-text{flex:1;min-width:0}
.row-name{font-size:18px;font-weight:700;color:#000;line-height:1.25}
.row.active .row-name{color:#0A3D4F}
.row-meta{font-size:12px;font-weight:600;color:#999;margin-top:1px}
.row.active .row-meta{color:rgba(0,60,80,.55)}
.chev{flex:none;font-size:16px;color:#999;transition:transform .3s}
.row.active .chev{transform:rotate(180deg);color:#0A3D4F}

.row-body{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 16px}
.row.active .row-body{max-height:340px;padding:12px 16px 14px}

.label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:#aaa;margin-bottom:5px}
.how{font-size:15px;font-weight:500;color:#333;line-height:1.45;padding:1px 0 1px 18px;position:relative}
.how::before{content:'→';position:absolute;left:0;color:#50D0ED;font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;font-weight:600;color:#0A3D4F;background:#f4f4f3;border:1px solid #ecedea;border-radius:20px;padding:3px 10px}
.chip::before{content:'✓ ';color:#10B981}

.scenario{margin-top:12px;background:#f7f7f5;border-left:4px solid #80EAFF;border-radius:0 8px 8px 0;padding:10px 14px}
.scenario .label{margin-bottom:2px}
.scenario-text{font-size:14px;font-weight:500;color:#555;line-height:1.45}

@media(max-width:520px){
  body{padding:16px 16px}
  .row-icon{display:none}
  .row.active .row-body{max-height:460px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-eyebrow">Three sourcing approaches</div>
    <div class="header-title">Your Sourcing Toolkit</div>
    <div class="header-sub">Tap an approach to see how it works and when to use it</div>
  </div>
  <div class="rows" id="rows"></div>
</div>
<script>
var DATA=[
  {
    icon:"📢",
    name:"Post & Wait",
    meta:"Low effort · 4–8 weeks · No extra cost",
    how:[
      "Post on LinkedIn, job boards, careers page",
      "Review incoming applications in Lever",
      "Candidates come to you"
    ],
    best:["Active applicant market","Junior–mid level","Common skill sets","60+ days to fill"],
    scenario:"Hiring a Marketing Coordinator — applicants are plentiful. Post it and let Lever collect résumés while you focus elsewhere."
  },
  {
    icon:"🔍",
    name:"Proactive Sourcing",
    meta:"High effort · 3–6 weeks · No extra cost",
    how:[
      "Search profiles in LinkedIn Recruiter",
      "Reach out to passive candidates directly",
      "Build the relationship over time"
    ],
    best:["Niche skills","Senior roles","Passive candidates","Competitive markets"],
    scenario:"Need a Senior DevOps Engineer with Kubernetes expertise. Few are job-hunting — find them yourself and pitch the role directly."
  },
  {
    icon:"🤝",
    name:"Agency Support",
    meta:"Low effort · 3–5 weeks · 20–30% of salary (your budget)",
    how:[
      "External recruiters source for you",
      "You get a pre-screened shortlist",
      "You interview and make the final call"
    ],
    best:["Urgent: under 30 days","Executive roles","Hard geographies","No bandwidth"],
    scenario:"Your VP of Sales resigned and the role must be filled in 30 days. An agency delivers vetted executives while you keep operations running."
  }
];
var sel=0;
function render(){
  var el=document.getElementById('rows');
  el.innerHTML=DATA.map(function(d,i){
    return '<div class="row'+(sel===i?' active':'')+'" data-i="'+i+'">'+
      '<div class="row-head">'+
        '<div class="row-num">'+(i+1)+'</div>'+
        '<div class="row-icon">'+d.icon+'</div>'+
        '<div class="row-text">'+
          '<div class="row-name">'+d.name+'</div>'+
          '<div class="row-meta">'+d.meta+'</div>'+
        '</div>'+
        '<div class="chev">▾</div>'+
      '</div>'+
      '<div class="row-body">'+
        '<div class="label">How it works</div>'+
        d.how.map(function(h){return '<div class="how">'+h+'</div>'}).join('')+
        '<div class="chips">'+d.best.map(function(b){return '<span class="chip">'+b+'</span>'}).join('')+'</div>'+
        '<div class="scenario">'+
          '<div class="label">Example</div>'+
          '<div class="scenario-text">'+d.scenario+'</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
  el.querySelectorAll('.row').forEach(function(r){
    r.querySelector('.row-head').addEventListener('click',function(){
      var i=parseInt(r.dataset.i);
      sel=sel===i?-1:i;
      render();
    });
  });
}
render();
</script>
</body>
</html>
